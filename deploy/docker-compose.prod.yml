# Production overrides for a single VPS. Use together with docker-compose.yml:
#   docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# Requires Docker Compose v2.24 or newer (for the !reset tag).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    restart: unless-stopped
    logging: *default-logging
    ports: !reset []
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    restart: unless-stopped
    logging: *default-logging
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  redis:
    restart: unless-stopped
    logging: *default-logging
    ports: !reset []
    command: ["redis-server", "--appendonly", "yes"]

  qdrant:
    restart: unless-stopped
    logging: *default-logging
    ports: !reset []

  web:
    restart: unless-stopped
    logging: *default-logging

  nginx:
    restart: unless-stopped
    logging: *default-logging
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes: !override
      - ./nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    # Reload every 6 hours so renewed certificates are picked up without downtime.
    command:
      - /bin/sh
      - -c
      - 'while :; do sleep 6h; nginx -s reload; done & exec nginx -g "daemon off;"'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
      - 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  certbot_www:
  letsencrypt:
